@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap');

@property --bg-a { syntax: '<color>'; inherits: false; initial-value: #101218; }

@property --bg-c { syntax: '<color>'; inherits: false; initial-value: #101218; }

/* ---------- 背景（3Dの外の層） ---------- */
.bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(70% 55% at 22% 18%, var(--bg-a), transparent 72%),
    radial-gradient(65% 60% at 82% 30%, var(--bg-b), transparent 72%),
    radial-gradient(80% 55% at 50% 100%, var(--bg-c), transparent 75%),

  transition: --bg-a 600ms ease, --bg-b 600ms ease, --bg-c 600ms ease, --bg-g 600ms ease;
}
.bg::after { /* 下へ向かって最下層の色に沈める */

}

  background: radial-gradient(closest-side, var(--bg-g), transparent);

}

}

}

}

/* ケース。--W は幅（px）、--H は高さ、--D は厚み */
.case { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }

.box.refl { top: calc(var(--H) * .5 + 3px); pointer-events: none; }

/* ケースの前面：ガラス・ちょうつがい・表紙 */
.cf { position: absolute; inset: 0; background: linear-gradient(135deg, #2a2e37, #14161c); border: 1px solid rgba(255, 255, 255, .16); border-radius: 2px; overflow: hidden; }

/* 表紙の絵（番号と色から自動で作る） */
.art {

.art .orb { position: absolute; right: -20%; top: -26%; width: 82%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 36% 36%, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 68%); }
.art .ring { position: absolute; right: 9%; top: 11%; width: 34%; aspect-ratio: 1; border-radius: 50%; border: calc(var(--W) * .028) solid rgba(255, 255, 255, .3); }
.art .ring.r2 { width: 20%; right: 16%; top: 18%; border-width: calc(var(--W) * .016); }

.art .num { position: absolute; left: 4%; bottom: 1%; font: 900 calc(var(--W) * .46)/.84 var(--f-ui); letter-spacing: -.02em; text-shadow: 0 calc(var(--W) * .012) calc(var(--W) * .035) rgba(0, 0, 0, .28); white-space: nowrap; }

/* 背表紙 */
.sp .fc { background: linear-gradient(90deg, var(--s1), var(--s2)); border-top: 1px solid rgba(255, 255, 255, .16); border-bottom: 1px solid rgba(0, 0, 0, .4); }
.sp .fc::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6%; background: var(--c1); opacity: .95; }
.sp .fc::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 34%, rgba(0, 0, 0, .18)); }
.spt { position: absolute; inset: 9% 0 4% 0; writing-mode: vertical-rl; display: flex; align-items: center; gap: .9em; font-size: calc(var(--D) * .4); line-height: 1; white-space: nowrap; color: rgba(255, 255, 255, .94); z-index: 1; }

.case .box.main .front { cursor: pointer; }

/* ---------- 下：スクラバーと最新へ ---------- */
.foot { width: min(100%, 880px); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: 24px; padding-top: 6px; }
.scrub { height: 46px; cursor: pointer; touch-action: none; display: flex; align-items: center; outline: none; border-radius: 8px; }
.scrub:focus-visible { outline: 2px solid rgba(244, 245, 247, .55); outline-offset: 2px; }
.ticks { width: 100%; display: flex; align-items: center; justify-content: space-between; height: 100%; pointer-events: none; }
.ticks i { display: block; width: calc(1px + 2px * var(--k, 0)); height: calc(10px + 24px * var(--k, 0)); border-radius: 2px; background: rgb(244, 245, 247); opacity: calc(.3 + .7 * var(--k, 0)); }
.count { margin: 0; text-align: center; font-size: 14px; color: var(--tx); letter-spacing: .06em; }
.latest {
  height: 46px; padding: 0 22px 0 18px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  background: rgba(244, 245, 247, .08); border: 1px solid rgba(244, 245, 247, .2); font-size: 15px; font-weight: 500;
  transition: background .2s, transform .15s var(--out), opacity .2s;
}
.latest:hover { background: rgba(244, 245, 247, .16); }
.latest:active { transform: scale(.96); }
.latest:focus-visible { outline: 2px solid rgba(244, 245, 247, .7); outline-offset: 2px; }
.latest:disabled { opacity: .45; cursor: default; }
.latest svg { width: 18px; height: 18px; }
@media (max-width: 560px) {
  .foot { grid-template-columns: minmax(0, 1fr); row-gap: 4px; justify-items: stretch; }
  .latest { justify-self: center; margin-top: 8px; }
}

/* ---------- 1枚を開いた画面 ---------- */
.detail { position: fixed; inset: 0; z-index: 5; overflow-y: auto; overflow-x: hidden; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.detail[hidden] { display: none; }
.back {
  position: fixed; z-index: 7; top: max(14px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  height: 44px; padding: 0 20px 0 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  background: rgba(16, 18, 24, .55); border: 1px solid rgba(244, 245, 247, .22); font-size: 15px; font-weight: 500;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .2s, transform .15s var(--out);
}
.back:hover { background: rgba(244, 245, 247, .16); }
.back:active { transform: scale(.96); }
.back:focus-visible { outline: 2px solid rgba(244, 245, 247, .7); outline-offset: 2px; }
.back svg { width: 18px; height: 18px; }
.back kbd { font: 500 11px var(--f-mono); color: var(--tx2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-left: 2px; }

.dwrap {

.dleft { display: grid; place-items: center; perspective: 1900px; }
.dcase { --W: clamp(220px, min(40vw, 62vh), 560px); --H: calc(var(--W) * .9); --D: calc(var(--W) * .115); position: relative; width: var(--W); height: var(--H); transform-style: preserve-3d; }
.dbase { position: absolute; inset: 0; background: linear-gradient(135deg, #22252d, #101218); border: 1px solid rgba(255, 255, 255, .14); border-radius: 2px; box-shadow: 0 30px 70px rgba(0, 0, 0, .5), 0 8px 20px rgba(0, 0, 0, .35); overflow: hidden; }
.dlid { position: absolute; inset: 0; transform-origin: 0 50%; transform-style: preserve-3d; }

.lb .hinge { left: auto; right: 0; }

.dright { min-width: 0; }
.d-eyebrow { margin: 0; font-size: 12px; letter-spacing: .18em; color: var(--tx2); font-weight: 500; }
.d-ver { margin: .08em 0 .12em; font: 900 clamp(60px, 9.4vw, 136px)/.98 var(--f-ui); letter-spacing: -.02em; }
.d-meta { display: flex; flex-wrap: wrap; gap: 12px 34px; margin: 0 0 clamp(18px, 3vh, 30px); padding: 0; }

.chip { display: inline-block; padding: 2px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid currentColor; }
.chip.s-major { color: var(--fix); }
.chip.s-minor { color: var(--chg); }
.chip.s-fix { color: var(--add); }

.grp { margin: 0 0 6px; }
.grp h3 { margin: 0; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: .08em; }

<script>
/* =====================================================================
   動きの数値（ここを直す）。長さの数値は「ケースの幅」に対する割合
   ===================================================================== */
const TUNE = {
  pull: 0.22,         // 今の1枚を手前へ引き出す量
  back: 0.10,         // 前後のケースが奥へ逃げる量
  fall: 0.004,        // 遠いケースほど、1枚ごとにさらに奥へ下がる量
  sideAngle: 74,      // 背表紙を見せるケースの角度（度）。大きいほど背が正面を向く
  depth: 0.115,       // ケースの厚み
  gap: 0.03,          // 中央の1枚と両隣のすき間
  pitchMargin: 1.14,  // 背表紙どうしの間隔の余裕（1.0で接する）
  slide: 1.0,         // 中央から隣へ移るときの滑り出し（大きいほど外へ出るのが遅れる）
  angleSpan: 0.7,     // 傾き終えるまでの距離（枚）。小さいほど早く背表紙を向ける
  springK: 150,       // ばねの硬さ（ふつうの送り）
  springZeta: 0.58,   // ばねの粘り。小さいほど行き過ぎて戻る（0.58で約1割行き過ぎる）
  flyK: 190,          // 「最新へ」・目盛りジャンプのばねの硬さ
  flyZeta: 0.68,
  wheel: 0.0055,      // ホイール1pxで動く枚数
  dragPx: 1.25,       // ドラッグで1枚動く距離（背表紙の間隔に対する倍率）
  lookahead: 0.14,    // 指を離したあと、勢いで先へ進む秒数
  wheelIdle: 110,     // ホイールが止まったと見なすまでのms
  maxVel: 14,         // 勢いの上限（枚/秒）
  shadeFar: 0.5,      // 隣のケースに重ねる黒の濃さ
  shadeStep: 0.035,   // 遠いほど足す黒の濃さ
  fitH: 0.62,         // ケース幅が棚の高さに占める割合の上限
  fitW: 0.50,         // ケース幅が画面幅に占める割合の上限
  persp: 4.4,         // 遠近の強さ（ケース幅の何倍の距離から見るか）
  openMs: 620,        // 開く動きの長さ
  startAt: 31         // 起動時の位置（1始まり）
};
</script>

<script>
/*@pure*/
/* ------- 版のデータ（ページの中に持つ）。種類 a=追加 c=変更 f=修正 d=削除 ------- */
const RAW = [

/* ------- 計算（画面から切り離した、同じ入力なら同じ結果になる関数） ------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = t => t * t * (3 - 2 * t);

/* 棚の寸法。W=ケース幅(px) */
function rackGeom(W, t) {
  const D = W * t.depth, th = t.sideAngle * Math.PI / 180, s = Math.sin(th), c = Math.cos(th);
  const ext = (W / 2) * c + (D / 2) * s;            // 傾けたケースが横に張り出す量
  return { W, H: W * 0.9, D, th, X0: W / 2 + ext + W * t.gap, pitch: D / s * t.pitchMargin,
           pull: t.pull * W, back: t.back * W, fall: t.fall * W };
}
/* 傾いたケースの表（ガラス面）は、背表紙の邪魔になるので傾くほど薄くする */
function frontOpacity(rotDeg) { return 1 - smooth(clamp((Math.abs(rotDeg) - 28) / 30, 0, 1)); }
/* ずれの量 d（今の位置から何枚離れているか。小数）→ 位置・角度・奥行き・暗さ */
function rackLayout(d, g, t) {
  const s = Math.abs(d), sg = d < 0 ? -1 : 1, u = Math.min(s, 1), e = smooth(u);
  const x = s < 1 ? g.X0 * Math.pow(smooth(s), t.slide) : g.X0 + (s - 1) * g.pitch;
  const a = g.th * smooth(clamp(s / t.angleSpan, 0, 1));
  const z = g.pull * (1 - e) - g.back * e - Math.max(0, s - 1) * g.fall;
  const shade = clamp(t.shadeFar * e + Math.max(0, s - 1) * t.shadeStep, 0, 0.86);
  return { x: sg * x, z, rot: sg * a * 180 / Math.PI, shade };
}
/* 止まる位置：勢いを少し先まで見て、いちばん近い1枚に吸い付く */
function snapTarget(pos, vel, n, t) {
  return clamp(Math.round(pos + clamp(vel, -t.maxVel, t.maxVel) * t.lookahead), 0, n - 1);
}
/* ばねの1歩 */
function springStep(pos, vel, target, dt, k, zeta) {
  const c = 2 * Math.sqrt(k) * zeta;
  const v = vel + (-k * (pos - target) - c * vel) * dt;
  return { pos: pos + v * dt, vel: v };
}
/* スクラバーの横位置(0〜1) → 何番目か */
function tickIndex(ratio, n) { return clamp(Math.round(ratio * (n - 1)), 0, n - 1); }

/* ------- 色 ------- */
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
function relLum([r, g, b]) {
  const f = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function contrastOf(l1, l2) { const a = Math.max(l1, l2), b = Math.min(l1, l2); return (a + 0.05) / (b + 0.05); }
/* 文字色 fgLum に対して minRatio 以上になるまで暗くする。戻り値は明るさ(%) */
function darkenFor(h, s, l, fgLum, minRatio) {
  while (l > 3 && contrastOf(fgLum, relLum(hslToRgb(h, s, l))) < minRatio) l -= 0.5;
  return l;
}
const LUM_TX2 = relLum([0xA6, 0xAC, 0xB8]);
const LUM_WHITE = 1;
/* 版の番号 → 色。大きな更新ごとに系統が変わり、小さな更新で色相が少しずつ進む */
function hueOf(p) {
  const base = { 1: 208, 2: 152, 3: 276 }[p[0]] ?? (p[0] * 70) % 360;
  return (base + p[1] * 8 + p[2] * 3) % 360;
}
function coverColors(p) {
  const h = hueOf(p);
  const l1 = darkenFor(h, 64, 46, LUM_WHITE, 4.6);
  const l2 = darkenFor(h + 18, 62, 32, LUM_WHITE, 4.6);
  return { h, c1: `hsl(${h} 64% ${l1}%)`, c2: `hsl(${(h + 18) % 360} 62% ${l2}%)`, s1: `hsl(${h} 46% 24%)`, s2: `hsl(${(h + 10) % 360} 44% 12%)` };
}
/* 背景の3色＋中央のにじみ。文字(#A6ACB8)に対して 4.5:1 以上を保つ。にじみは文字の乗らない中央だけ明るくてよい */
function bgColors(p) {
  const h = hueOf(p);
  const mk = (hh, s, l0) => { const l = darkenFor(hh, s, l0, LUM_TX2, 4.6); return { css: `hsl(${(hh + 360) % 360} ${s}% ${l}%)`, rgb: hslToRgb(hh, s, l), l }; };
  const a = mk(h, 70, 36), b = mk(h + 34, 62, 30), c = mk(h - 28, 58, 26);
  return { a: a.css, b: b.css, c: c.css, g: `hsl(${h} 72% 36%)`, lums: [a, b, c].map(x => relLum(x.rgb)) };
}

  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = mq.matches;
  mq.addEventListener?.('change', e => { reduce = e.matches; });
  hint.textContent = matchMedia('(pointer: coarse)').matches ? '中央の1枚をタップで開く' : '中央の1枚をクリック、または Enter で開く';

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- 表紙・背表紙・ケースの中身 ---------- */
  const COVER = VERS.map(v => coverColors(v.p));
  const artStyle = i => `--c1:${COVER[i].c1};--c2:${COVER[i].c2}`;
  function artHTML(i) {
    const v = VERS[i], big = v.size === 'major';
    return `<div class="art" style="${artStyle(i)}"><div class="lines"></div><div class="orb"></div>` +
      (big ? '<div class="ring"></div><div class="ring r2"></div>' : '') +
      `<div class="cap">Sample Notes · v${v.ver}</div><div class="num">${v.p[0]}.${v.p[1]}</div></div>`;
  }
  const frontHTML = i => `<div class="cf"><div class="hinge"></div>${artHTML(i)}<i class="gloss"></i></div>`;
  const spineHTML = i => `<div class="spt"><b>Sample Notes</b><span>v${VERS[i].ver}</span></div>`;
  function faces(i) {
    const sp = spineHTML(i);
    return `<div class="face front"><div class="fc">${frontHTML(i)}<i class="shade"></i></div></div>` +
           `<div class="face sp sl"><div class="fc">${sp}<i class="shade"></i></div></div>` +
           `<div class="face sp sr"><div class="fc">${sp}<i class="shade"></i></div></div>`;
  }
  function buildCase(i) {
    const el = document.createElement('div');
    el.className = 'case'; el.dataset.i = i;
    el.style.cssText = `--c1:${COVER[i].c1};--s1:${COVER[i].s1};--s2:${COVER[i].s2}`;
    el.innerHTML = `<div class="box main">${faces(i)}</div><div class="box refl" aria-hidden="true">${faces(i)}</div>`;
    return el;
  }

  /* ---------- 状態 ---------- */
  const S = { pos: TUNE.startAt - 1, vel: 0, target: TUNE.startAt - 1, direct: false, fly: false, zFly: TUNE.flyZeta };
  let G = rackGeom(300, TUNE), R = 8, curIdx = -1, view = 'rack', stageW = 0, stageH = 0;
  const live_ = new Map();

  /* ---------- 大きさ ---------- */
  function measure() {
    stageW = stage.clientWidth; stageH = stage.clientHeight;
    const W = clamp(Math.min(stageH * TUNE.fitH, stageW * TUNE.fitW), 120, 440);
    G = rackGeom(W, TUNE);
    const cy = Math.max(G.H / 2 + 10, (stageH - G.H * 1.36) / 2 + G.H / 2);
    stage.style.setProperty('--W', G.W.toFixed(1) + 'px');
    stage.style.setProperty('--H', G.H.toFixed(1) + 'px');
    stage.style.setProperty('--D', G.D.toFixed(1) + 'px');
    stage.style.setProperty('--cy', cy.toFixed(1) + 'px');
    stage.style.setProperty('--persp', (G.W * TUNE.persp).toFixed(0) + 'px');
    R = clamp(Math.ceil((stageW / 2 + G.W * 0.2 - G.X0) / G.pitch) + 2, 3, 15);
  }

  /* ---------- 描く ---------- */
  const tickEls = [];
  for (let i = 0; i < N; i++) { const t = document.createElement('i'); ticksEl.appendChild(t); tickEls.push(t); }
  const tickK = new Array(N).fill(-1);

  /* 重なりの描き順：外側ほど後（上）、中央の1枚をいちばん上に */
  let orderIdx = -1;
  function orderDom(idx) {
    [...live_.keys()].sort((a, b) => (a === idx ? 1e9 : Math.abs(a - idx)) - (b === idx ? 1e9 : Math.abs(b - idx)))
      .forEach(i => rack.appendChild(live_.get(i)));
  }
  function render() {
    const idx = clamp(Math.round(S.pos), 0, N - 1);
    if (idx !== curIdx) setIndex(idx);
    const lo = Math.max(0, idx - R), hi = Math.min(N - 1, idx + R);
    for (const [i, el] of live_) if (i < lo || i > hi) { el.remove(); live_.delete(i); }
    let added = false;
    for (let i = lo; i <= hi; i++) {
      let el = live_.get(i);
      if (!el) { el = buildCase(i); live_.set(i, el); rack.appendChild(el); added = true; }
      const L = rackLayout(i - S.pos, G, TUNE);
      el.style.transform = `translate3d(${L.x.toFixed(2)}px,0,${L.z.toFixed(2)}px) rotateY(${L.rot.toFixed(3)}deg)`;
      el.style.setProperty('--shade', L.shade.toFixed(3));
      el.style.setProperty('--fo', frontOpacity(L.rot).toFixed(3));
    }
    if (added || idx !== orderIdx) { orderIdx = idx; orderDom(idx); }
    for (let i = 0; i < N; i++) {
      const k = Math.pow(Math.max(0, 1 - Math.abs(i - S.pos) / 2.4), 2);
      const kk = Math.round(k * 200) / 200;
      if (kk !== tickK[i]) { tickK[i] = kk; tickEls[i].style.setProperty('--k', kk); }
    }
  }

  /* ---------- 版が変わったとき ---------- */
  let lastBg = -1;
  function setBg(i) {
    const c = bgColors(VERS[i].p);
    bgEl.style.setProperty('--bg-a', c.a); bgEl.style.setProperty('--bg-b', c.b);
    bgEl.style.setProperty('--bg-c', c.c); bgEl.style.setProperty('--bg-g', c.g);
  }
  function titleText(v) { return 'v' + v.ver; }
  function setIndex(i) {
    const first = curIdx < 0;
    curIdx = i;
    const v = VERS[i];
    countEl.textContent = `${i + 1} / ${N}`;
    scrub.setAttribute('aria-valuenow', i + 1);
    live.textContent = `v${v.ver}、${v.date}、${SIZE_LABEL[v.size]}`;
    latestBtn.disabled = (i === N - 1 && S.target === N - 1);
    setBg(i);
    if (first) { ttl.textContent = titleText(v); } else swapTitle(titleText(v));
    meta.innerHTML = `<span class="mono">${v.date}</span><span class="sep">・</span><span>変更 <span class="mono">${v.ch.length}</span>件</span><span class="sep">・</span><span>${SIZE_LABEL[v.size]}</span>`;
    if (!first && !reduce) meta.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.9,.25,1)' });
  }
  /* 題名：上へ抜けて、下から入る（切らない・中央から動かさない） */
  function swapTitle(text) {
    if (reduce) { ttl.textContent = text; return; }
    const fast = Math.abs(S.vel) > 6;
    if (!fast) {
      const ghost = ttl.cloneNode(true);
      ghost.removeAttribute('id'); ghost.setAttribute('aria-hidden', 'true');
      ttlWrap.appendChild(ghost);
      while (ttlWrap.children.length > 4) ttlWrap.children[1].remove();
      ghost.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-64%)', opacity: 0 }],
        { duration: 190, easing: 'cubic-bezier(.4,0,.8,.4)', fill: 'forwards' }).onfinish = () => ghost.remove();
    }
    ttl.textContent = text;
    ttl.animate([{ transform: 'translateY(58%)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }],
      { duration: 270, easing: 'cubic-bezier(.2,.9,.25,1)' });
  }

  /* ---------- ばねの動きの輪 ---------- */
  let raf = 0, last = 0;
  function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function frame(now) {
    raf = 0;
    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000)); last = now;
    let moving = S.direct;
    if (!S.direct) {
      const k = S.fly ? TUNE.flyK : TUNE.springK, z = S.fly ? S.zFly : TUNE.springZeta;
      const sub = Math.ceil(dt / (1 / 240)), h = dt / sub;
      for (let n = 0; n < sub; n++) { const r = springStep(S.pos, S.vel, S.target, h, k, z); S.pos = r.pos; S.vel = r.vel; }
      S.pos = clamp(S.pos, -0.6, N - 0.4);
      if (Math.abs(S.target - S.pos) < 0.0008 && Math.abs(S.vel) < 0.01) { S.pos = S.target; S.vel = 0; S.fly = false; }
      else moving = true;
    }
    render();
    if (moving) kick();
    else latestBtn.disabled = (curIdx === N - 1);
  }
  function goTo(i, fly) {
    i = clamp(Math.round(i), 0, N - 1);
    /* 遠くへ飛ぶときは行き過ぎが大きくなるので、距離に応じて粘りを足す */
    S.zFly = clamp(TUNE.flyZeta + 0.04 * Math.max(0, Math.abs(i - S.pos) - 1), TUNE.flyZeta, 1);
    S.target = i; S.direct = false; S.fly = !!fly;
    if (reduce) { S.pos = i; S.vel = 0; S.fly = false; render(); latestBtn.disabled = (i === N - 1); return; }
    kick();
  }
  const step = n => goTo((S.direct ? Math.round(S.pos) : S.target) + n, false);

  /* ---------- 入力：ホイール ---------- */
  let wheelTimer = 0, racc = 0;
  function pushDelta(items) {
    if (reduce) { racc += items; if (Math.abs(racc) >= 0.5) { step(Math.sign(racc)); racc = 0; } return; }
    if (!S.direct) { S.direct = true; S.vel = 0; }
    let np = S.pos + items;
    if (np < 0 || np > N - 1) np = S.pos + items * 0.35; // 端では重く
    S.pos = clamp(np, -0.5, N - 0.5);
    kick();
  }
  function release() {
    if (!S.direct) return;
    S.direct = false; S.fly = false;
    S.target = snapTarget(S.pos, S.vel, N, TUNE);
    kick();
  }
  stage.addEventListener('wheel', e => {
    if (view !== 'rack') return;
    e.preventDefault();
    const raw = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    const px = raw * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    const t = performance.now();
    const items = px * TUNE.wheel;
    if (!S.direct) S.vel = 0;
    else { const dtw = Math.max(0.016, (t - (stage._wt || t)) / 1000); S.vel = S.vel * 0.6 + (items / dtw) * 0.4; }
    stage._wt = t;
    pushDelta(items);
    clearTimeout(wheelTimer); wheelTimer = setTimeout(release, TUNE.wheelIdle);
  }, { passive: false });

  /* ---------- 入力：ドラッグ・タップ ---------- */
  let drag = null;
  stage.addEventListener('pointerdown', e => {
    if (view !== 'rack' || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { id: e.pointerId, x0: e.clientX, x: e.clientX, t: performance.now(), pos0: S.pos, moved: false, el: e.target };
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved) {
      if (Math.abs(dx) < 6) return;
      drag.moved = true; stage.setPointerCapture?.(e.pointerId); stage.classList.add('dragging');
      S.vel = 0; if (!reduce) S.direct = true; drag.pos0 = S.pos; drag.x0 = e.clientX; drag.x = e.clientX; drag.t = performance.now(); drag.acc = 0;
      return;
    }
    const pxPer = Math.max(18, G.pitch * TUNE.dragPx);
    const now = performance.now(), dtm = Math.max(0.008, (now - drag.t) / 1000);
    const items = -(e.clientX - drag.x) / pxPer;
    if (reduce) { drag.acc += items; if (Math.abs(drag.acc) >= 0.5) { step(Math.sign(drag.acc)); drag.acc = 0; } }
    else {
      S.vel = S.vel * 0.65 + (items / dtm) * 0.35;
      let np = S.pos + items;
      if (np < 0 || np > N - 1) np = S.pos + items * 0.35;
      S.pos = clamp(np, -0.5, N - 0.5); kick();
    }
    drag.x = e.clientX; drag.t = now;
  });
  const fadeHint = () => hint.classList.add('gone');
  ['wheel', 'pointerdown', 'keydown'].forEach(t => document.addEventListener(t, fadeHint, { once: true, passive: true }));
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; stage.classList.remove('dragging');
    if (d.moved) { if (e.type === 'pointerup') release(); else release(); return; }
    if (e.type !== 'pointerup') return;
    const c = d.el.closest && d.el.closest('.case');
    if (!c || c.closest('.refl')) return;
    const i = +c.dataset.i;
    if (i === curIdx && Math.abs(S.pos - i) < 0.35) openDetail(); else goTo(i, false);
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  /* ---------- 入力：スクラバー・最新へ ---------- */
  let sdrag = false;
  const scrubTo = e => {
    const r = ticksEl.getBoundingClientRect();
    goTo(tickIndex((e.clientX - r.left) / r.width, N), true);
  };
  scrub.addEventListener('pointerdown', e => { if (view !== 'rack') return; sdrag = true; scrub.setPointerCapture?.(e.pointerId); scrubTo(e); });
  scrub.addEventListener('pointermove', e => { if (sdrag) scrubTo(e); });
  const sEnd = () => { sdrag = false; };
  scrub.addEventListener('pointerup', sEnd); scrub.addEventListener('pointercancel', sEnd);
  latestBtn.addEventListener('click', () => { if (view === 'rack') goTo(N - 1, true); });

  /* ---------- 入力：キー ---------- */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (view === 'detail' || view === 'opening') { e.preventDefault(); closeDetail(); } return; }
    if (view !== 'rack') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0, true); }
    else if (e.key === 'End') { e.preventDefault(); goTo(N - 1, true); }
    else if ((e.key === 'Enter' || e.key === ' ') && !(e.target.closest && e.target.closest('button'))) {
      e.preventDefault(); openDetail();
    }
  });

  /* ---------- 1枚を開く ---------- */
  function fillDetail(i) {
    const v = VERS[i], cc = COVER[i];
    dcase.style.cssText = `--c1:${cc.c1};--c2:${cc.c2}`;
    dbase.innerHTML = `<div class="hinge"></div>${artHTML(i)}`;
    dlid.innerHTML = `<div class="lf">${frontHTML(i)}</div><div class="lb"><div class="hinge"></div></div>`;
    const groups = TYPE_ORDER.map(t => {
      const items = v.ch.filter(c => c[0] === t);
      if (!items.length) return '';
      return `<section class="grp t-${t}"><h3><i></i><span class="gname">${TYPE_LABEL[t]}</span><span class="gcount mono">${String(items.length).padStart(2, '0')}</span></h3><ul>${items.map(c => `<li>${esc(c[1])}</li>`).join('')}</ul></section>`;
    }).join('');
    dright.style.setProperty('--acc', `hsl(${cc.h} 70% 62%)`);
    dright.innerHTML =
      `<p class="d-eyebrow">SAMPLE NOTES ・ リリースノート</p>` +
      `<h2 class="d-ver">v${v.ver}</h2>` +
      `<dl class="d-meta"><div><dt>公開日</dt><dd class="mono">${v.date}</dd></div>` +
      `<div><dt>更新の大きさ</dt><dd><span class="chip s-${v.size}">${SIZE_LABEL[v.size]}</span></dd></div>` +
      `<div><dt>担当</dt><dd>${esc(v.owner)}</dd></div></dl>` +
      `<p class="d-sum">${esc(v.sum)}</p>${groups}`;
  }
  const centerFront = () => { const el = live_.get(curIdx); return el && el.querySelector('.main .front'); };
  const blocks = () => dright.querySelectorAll('.d-eyebrow,.d-ver,.d-meta,.d-sum,.grp');
  const EASE = 'cubic-bezier(.2,.9,.25,1)';
  let wantClose = false;
  const done = a => a.finished.catch(() => {});

  async function openDetail() {
    if (view !== 'rack') return;
    if (S.direct) release();
    if (Math.abs(S.pos - curIdx) > 0.01) { S.pos = curIdx; S.target = curIdx; S.vel = 0; render(); }
    view = 'opening'; wantClose = false;
    const i = curIdx;
    const fr = centerFront();
    const r0 = fr ? fr.getBoundingClientRect() : null;
    fillDetail(i);
    detail.hidden = false; detail.scrollTop = 0; root.classList.add('is-detail');
    app.inert = true;
    if (reduce || !r0) {
      app.style.visibility = 'hidden'; view = 'detail'; backBtn.focus({ preventScroll: true }); return;
    }
    const r1 = dcase.getBoundingClientRect();
    const sc = r0.width / r1.width;
    const dx = (r0.left + r0.width / 2) - (r1.left + r1.width / 2), dy = (r0.top + r0.height / 2) - (r1.top + r1.height / 2);
    const T = TUNE.openMs;
    const anims = [];
    anims.push(dcase.animate([{ transform: `translate(${dx}px,${dy}px) scale(${sc})` }, { transform: 'none' }], { duration: T * 0.6, easing: EASE, fill: 'both' }));
    anims.push(dlid.animate([
      { transform: 'rotateY(0deg)', opacity: 1, offset: 0 },
      { transform: 'rotateY(-118deg)', opacity: 1, offset: 0.78 },
      { transform: 'rotateY(-160deg)', opacity: 0, offset: 1 }],
      { duration: T * 0.72, delay: T * 0.28, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'both' }));
    anims.push(app.animate([{ opacity: 1 }, { opacity: 0 }], { duration: T * 0.42, delay: T * 0.08, easing: 'ease-out', fill: 'forwards' }));
    anims.push(backBtn.animate([{ opacity: 0, transform: 'translateX(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 300, delay: T * 0.5, easing: EASE, fill: 'both' }));
    [...blocks()].forEach((b, n) => anims.push(b.animate([{ opacity: 0, transform: 'translateY(22px)' }, { opacity: 1, transform: 'none' }],
      { duration: 420, delay: T * 0.42 + n * 55, easing: EASE, fill: 'both' })));
    await Promise.all(anims.map(done));
    anims.forEach(a => { try { a.commitStyles?.(); } catch (_) {} });
    anims.forEach(a => a.cancel());
    dlid.style.opacity = '0';
    app.style.visibility = 'hidden'; app.style.opacity = '';
    view = 'detail';
    backBtn.focus({ preventScroll: true });
    if (wantClose) closeDetail();
  }

  async function closeDetail() {
    if (view === 'opening') { wantClose = true; return; }
    if (view !== 'detail') return;
    view = 'closing';
    const finish = () => {
      detail.hidden = true; root.classList.remove('is-detail');
      app.style.visibility = ''; app.style.opacity = ''; app.inert = false;
      dlid.style.opacity = ''; dcase.getAnimations().forEach(a => a.cancel());
      view = 'rack'; stage.focus({ preventScroll: true });
    };
    if (reduce) { finish(); return; }
    app.style.visibility = ''; app.style.opacity = '0';
    const fr = centerFront(); const r0 = fr && fr.getBoundingClientRect();
    if (!r0) { finish(); return; }
    const r1 = dcase.getBoundingClientRect();
    const sc = r0.width / r1.width;
    const dx = (r0.left + r0.width / 2) - (r1.left + r1.width / 2), dy = (r0.top + r0.height / 2) - (r1.top + r1.height / 2);
    dlid.style.opacity = '';
    const T = TUNE.openMs * 0.85;
    const anims = [];
    [...blocks()].forEach((b, n) => anims.push(b.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(10px)' }], { duration: 160, delay: n * 12, easing: 'ease-in', fill: 'forwards' })));
    anims.push(backBtn.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }));
    anims.push(dlid.animate([
      { transform: 'rotateY(-160deg)', opacity: 0, offset: 0 },
      { transform: 'rotateY(-118deg)', opacity: 1, offset: 0.25 },
      { transform: 'rotateY(0deg)', opacity: 1, offset: 1 }],
      { duration: T * 0.5, delay: 80, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'both' }));
    anims.push(dcase.animate([{ transform: 'none' }, { transform: `translate(${dx}px,${dy}px) scale(${sc})` }], { duration: T * 0.55, delay: T * 0.3, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'both' }));
    anims.push(app.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T * 0.35, delay: T * 0.62, easing: 'ease-out', fill: 'both' }));
    await Promise.all(anims.map(done));
    anims.forEach(a => a.cancel());
    finish();
  }
  backBtn.addEventListener('click', closeDetail);

  /* ---------- 起動 ---------- */
  let rt = 0;
  new ResizeObserver(() => { cancelAnimationFrame(rt); rt = requestAnimationFrame(() => { measure(); render(); }); }).observe(stage);
  measure(); render();
  latestBtn.disabled = false;
})();
</script>
<style>
/* 体験版の帯（公開用だけに足す） */
.demo-band {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 12px;
  min-height: 32px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(8, 9, 12, .82); border-bottom: 1px solid rgba(244, 245, 247, .12);
  font-size: 12px; line-height: 1.5; color: #A6ACB8;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.demo-band b { color: #F4F5F7; font-weight: 700; letter-spacing: .08em; }
.demo-band a { color: #F4F5F7; text-decoration: underline; text-underline-offset: 3px; }
.demo-band a:focus-visible { outline: 2px solid rgba(244, 245, 247, .6); outline-offset: 2px; border-radius: 2px; }
.app { padding-top: calc(42px + env(safe-area-inset-top, 0px)); }
.detail { padding-top: 34px; }
.back { top: calc(46px + env(safe-area-inset-top, 0px)); }
</style>
</body>
